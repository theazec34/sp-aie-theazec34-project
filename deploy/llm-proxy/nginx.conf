# Reverse proxy hacia llm.4geeks.ai en network_mode:host.
# Los contenedores bridge (backend) no tienen egress TCP; el host sí.
# Backend → http://host.docker.internal:18080/v1/... → https://llm.4geeks.ai/v1/...

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout combined;
    client_max_body_size 20m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    server {
        listen 18080;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_pass https://llm.4geeks.ai;
            proxy_ssl_server_name on;
            proxy_ssl_name llm.4geeks.ai;
            proxy_set_header Host llm.4geeks.ai;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;
        }
    }
}
