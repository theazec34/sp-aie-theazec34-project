[project]
name = "brasaland-sales-forecast"
version = "0.1.0"
description = "Brasaland revenue forecasting and model evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
