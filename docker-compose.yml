# Brasaland Digital — plataforma local con un comando:
#   docker compose up --build
#
# Secrets viven en `.env` (gitignored). No hardcodear claves aquí.
# Red interna: Redis / Qdrant / Flower NO se publican a internet (OWASP A05).
# Host solo: HTTPS/API (8000), frontends (3000/3001). Flower opcional en loopback.

services:
  backend:
    build:
      # Root context: needed for packages/shared/python (analyzer imports)
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-backend
    env_file:
      - .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: código del host → contenedor
      - ./services/api:/app/api
      - ./services/celery_app.py:/app/celery_app.py
      - ./services/tasks:/app/tasks
      - ./services/agent:/app/agent
      - ./packages:/packages
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - ./data:/app/data:ro
      # Persistencia TinyDB / SQLite / CSV uploads compartidos con worker
      - backend_data:/app/api/data
    depends_on:
      - qdrant
      - redis
    networks:
      - brasaland-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-worker
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      PYTHONPATH: /app/api:/app
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=INFO"]
    volumes:
      - ./services/api:/app/api
      - ./services/celery_app.py:/app/celery_app.py
      - ./services/tasks:/app/tasks
      - ./services/agent:/app/agent
      - ./packages:/packages
      - backend_data:/app/api/data
    depends_on:
      - redis
      - backend
    networks:
      - brasaland-net
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-flower
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app/api:/app
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    command:
      [
        "celery",
        "-A",
        "celery_app.celery",
        "flower",
        "--port=5555",
        "--basic_auth=${FLOWER_BASIC_AUTH:-ops:change-me-flower}",
      ]
    # Solo loopback — no exposición a internet (BRIEFING hardening)
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./services/celery_app.py:/app/celery_app.py
      - ./services/tasks:/app/tasks
    depends_on:
      - redis
      - worker
    networks:
      - brasaland-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: brasaland-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--bind", "0.0.0.0", "--protected-mode", "yes"]
    # Sin ports: — solo red interna brasaland-net (CRITICAL fix OWASP A05)
    volumes:
      - redis_data:/data
    networks:
      - brasaland-net
    restart: unless-stopped

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: brasaland-interfaces
    env_file:
      - .env
    environment:
      # Explicit for Next.js at runtime (browser still sees host localhost URLs)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      # Preserve image node_modules under bind mounts
      - website_node_modules:/app/website/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules
    depends_on:
      - backend
    networks:
      - brasaland-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: brasaland-qdrant
    # Sin ports públicos — solo backend/worker vía brasaland-net
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - brasaland-net
    restart: unless-stopped

networks:
  brasaland-net:
    name: brasaland-net
    driver: bridge
    internal: false

volumes:
  backend_data:
  website_node_modules:
  backoffice_node_modules:
  qdrant_data:
  redis_data:
