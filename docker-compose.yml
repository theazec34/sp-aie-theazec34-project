# Brasaland Digital — plataforma local con un comando:
#   docker compose up --build
#
# Secrets viven en `.env` (gitignored). No hardcodear claves aquí.
# Red interna: Redis / Qdrant / Flower NO se publican a internet (OWASP A05).
# Host solo: HTTPS/API (8000), frontends (3000/3001). Flower opcional en loopback.

services:
  backend:
    build:
      # Root context: needed for packages/shared/python (analyzer imports)
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-backend
    env_file:
      - .env
    environment:
      # Forzar hostnames de la red Compose (ignora 127.0.0.1 del .env local)
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # FastEmbed baja modelos de HuggingFace; en Codespaces a menudo no hay DNS → hash offline
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      # Si el servicio qdrant no responde (volumen corrupto), BrasAI usa disco local
      QDRANT_FORCE_LOCAL: ${QDRANT_FORCE_LOCAL:-0}
      # Fallbacks locales si `.env` está incompleto (login JWT necesita SECRET_KEY)
      SECRET_KEY: ${SECRET_KEY:-dev-brasaland-change-me-in-production}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@brasaland.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMeLocalOnly12!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin Brasaland}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: código del host → contenedor
      - ./services/api:/app/api
      - ./services/celery_app.py:/app/celery_app.py
      - ./services/tasks:/app/tasks
      - ./services/agent:/app/agent
      - ./services/knowledge:/app/knowledge
      # MCP tools: el agente monta agent/ fresco pero sin esto usa mcps de la imagen
      # (vieja → query_suppliers ausente → «No pude leer el directorio…»).
      - ./mcps:/app/mcps
      - ./packages:/packages
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - ./data:/app/data:ro
      # Persistencia TinyDB / SQLite / CSV uploads compartidos con worker
      - backend_data:/app/api/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    # Codespaces: DNS del contenedor suele fallar hacia internet (UDP/53).
    # DNS públicos ayudan a veces; extra_hosts garantiza llm.4geeks.ai.
    # Override: LLM_4GEEKS_IP=x.x.x.x en .env (o scripts/codespace-fix-llm-dns.sh).
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "llm.4geeks.ai:${LLM_4GEEKS_IP:-68.183.63.85}"
    networks:
      - brasaland-net
    restart: unless-stopped

  # Proxy LLM en red del host: el bridge de Codespaces resuelve DNS pero
  # TCP:443 a internet hace timeout; el host sí llega a llm.4geeks.ai.
  llm-proxy:
    image: nginx:alpine
    container_name: brasaland-llm-proxy
    network_mode: host
    volumes:
      - ./deploy/llm-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      PYTHONPATH: /app/api:/app
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=INFO"]
    volumes:
      - ./services/api:/app/api
      - ./services/celery_app.py:/app/celery_app.py
      - ./services/tasks:/app/tasks
      - ./services/agent:/app/agent
      - ./mcps:/app/mcps
      - ./packages:/packages
      - backend_data:/app/api/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      llm-proxy:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "llm.4geeks.ai:${LLM_4GEEKS_IP:-68.183.63.85}"
    networks:
      - brasaland-net
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-flower
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/api:/app
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    command:
      [
        "celery",
        "-A",
        "celery_app.celery",
        "flower",
        "--port=5555",
        "--basic_auth=${FLOWER_BASIC_AUTH:-ops:change-me-flower}",
      ]
    # Solo loopback — no exposición a internet (BRIEFING hardening)
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./services/celery_app.py:/app/celery_app.py
      - ./services/tasks:/app/tasks
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - brasaland-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: brasaland-redis
    # protected-mode no: sin requirepass, Redis rechazaría clientes de otros
    # contenedores (worker/Flower → Timeout). Sin ports públicos = OWASP A05 OK.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    # Sin ports: — solo red interna brasaland-net (CRITICAL fix OWASP A05)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - brasaland-net
    restart: unless-stopped

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: brasaland-interfaces
    env_file:
      - .env
    # En Codespaces a veces TCP contenedor→contenedor a :8000 hace timeout
    # aunque DNS resuelva; el puerto publicado en el host sí responde.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Browser → /api-backend (Route Handler); server → API vía host gateway
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:-http://localhost:8000}
      # Forzar host-gateway (ignora INTERNAL_API_URL=backend del .env).
      # En Codespaces TCP interfaces→backend:8000 hace TIMEOUT; el puerto del host sí responde.
      INTERNAL_API_URL: http://host.docker.internal:8000
      # Node a veces resuelve AAAA primero y falla el proxy → backend
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      # Preserve image node_modules under bind mounts
      - website_node_modules:/app/website/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - brasaland-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: brasaland-qdrant
    # Sin ports públicos — solo backend/worker vía brasaland-net
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s
    networks:
      - brasaland-net
    restart: unless-stopped

networks:
  brasaland-net:
    name: brasaland-net
    driver: bridge
    internal: false

volumes:
  backend_data:
  website_node_modules:
  backoffice_node_modules:
  qdrant_data:
  redis_data:
